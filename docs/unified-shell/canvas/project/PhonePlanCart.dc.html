<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Plan cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f5f1}
a{color:#1f5c3a}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b6f63}
.num{font-family:'Space Grotesk',sans-serif;font-weight:600}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.step{width:32px;height:34px;border:0;background:transparent;font:600 16px 'Plus Jakarta Sans';color:#1f5c3a}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f5f1; font-family: 'Plus Jakarta Sans', sans-serif; color: #1c1e17">

<header style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid rgba(20,22,15,.07); background: rgba(246,245,241,.92)">
<span class="disp" style="font-size: 22px; color: #0f3d2e">KOI</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #e8743b; margin-top: 8px"></span>
<span style="flex: 1"></span>
<button type="button" aria-label="Search" style="width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid rgba(20,22,15,.1)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c1e17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
<button type="button" style="height: 38px; padding: 0 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(20,22,15,.1); font: 600 12.5px 'Plus Jakarta Sans'">Delhi</button>
</header>
<div style="height: 50px; display: flex; align-items: center; gap: 6px; padding: 0 16px; background: #faf9f6; border-bottom: 1px solid rgba(20,22,15,.07); overflow: hidden">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="6"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 5px; border-radius: 999px; font: 600 12.5px 'Plus Jakarta Sans'; color: {{st.color}}; background: {{st.bg}}; box-shadow: {{st.shadow}}"><span class="num" style="width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; background: {{st.dotBg}}; color: {{st.dotColor}}">{{st.mark}}</span>{{st.label}}</span></sc-for>
</div>

<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-end; justify-content: space-between"><div style="display: flex; flex-direction: column; gap: 4px"><span class="mono">Step 5 of 6</span><span style="font: 800 26px 'Plus Jakarta Sans'; letter-spacing: -.025em">Your cart</span></div><span class="mono"><span class="num">10</span> products</span></div>

<section style="background: #fff; border: 1px solid rgba(20,22,15,.07); border-radius: 18px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fbfaf7"><span style="width: 32px; height: 32px; border-radius: 9px; background: #e8f1ea; display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1f5c3a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5h14v15H5zM5 10h14M9 3v4M15 3v4"/></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span class="mono" style="color: #1f5c3a">This week's plan · for 6</span><span style="font-size: 12.5px; color: #6b6f63"><span class="num">9</span> products</span></span><span class="num" style="font-size: 15px">₹3,408</span></div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #f0eee7">
<div style="width: 42px; height: 42px; border-radius: 11px; background: {{l.plate}}; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden"><sc-if value="{{l.img}}" hint-placeholder-val="{{false}}"><img src="{{l.img}}" alt="" style="width: 38px; height: 38px; object-fit: contain; mix-blend-mode: multiply"></sc-if><sc-if value="{{l.noImg}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8fae98" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19zM5 19l7-7"/></svg></sc-if></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span><span class="mono" style="letter-spacing: .05em">{{l.size}} · ₹<span class="num">{{l.cost}}</span></span></div>
<div style="display: inline-flex; align-items: center; background: #faf9f6; border: 1px solid rgba(20,22,15,.1); border-radius: 11px; height: 34px"><button type="button" class="step" aria-label="One fewer">−</button><span class="num" style="width: 18px; text-align: center; font-size: 14px">{{l.packs}}</span><button type="button" class="step" aria-label="One more">+</button></div>
</div>
</sc-for>
<div style="padding: 10px 14px; border-top: 1px solid #f0eee7; font: 600 13px 'Plus Jakarta Sans'; color: #1f5c3a">Show all <span class="num">9</span></div>
</section>

<section style="background: #fff; border: 1px solid rgba(20,22,15,.07); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px">
<div style="width: 42px; height: 42px; border-radius: 11px; background: #f4f1e9; display: flex; align-items: center; justify-content: center; flex: none"><img src="/_blob/6b46d92120ccba28b5a1c8a9eb180b1a" alt="" style="width: 38px; height: 38px; object-fit: contain; mix-blend-mode: multiply"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span class="mono">Also in your cart</span><span style="font-size: 13.5px; font-weight: 600">California Almonds</span></div>
<span class="num" style="font-size: 14px">₹450</span>
</section>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 92px; height: 56px; display: flex; gap: 8px">
<button type="button" aria-label="Ask KOI" style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: rgba(250,249,246,.9); border: 1px solid rgba(20,22,15,.08); box-shadow: 0 12px 40px rgba(31,92,58,.2); display: inline-flex; align-items: center; justify-content: center"><span class="disp" style="font-size: 18px; color: #0f3d2e">K</span></button>
<a href="PhoneCheckout.dc.html" style="flex: 1; height: 56px; border-radius: 18px; background: #0f3d2e; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; box-shadow: 0 12px 30px -12px rgba(15,61,46,.6)"><span style="display: flex; flex-direction: column"><span class="num" style="font-size: 17px">₹3,858</span><span class="mono" style="color: #9fe7c4; font-size: 9.5px">10 products · MRP</span></span><span style="flex: 1"></span><span style="background: #9fe7c4; color: #0f3d2e; font: 700 14px 'Plus Jakarta Sans'; border-radius: 12px; padding: 10px 14px">Checkout →</span></a>
</div>
<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px; border-radius: 22px; background: rgba(255,255,255,.97); box-shadow: 0 10px 30px rgba(15,61,46,.12); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font: 600 10.5px 'Plus Jakarta Sans'; color: {{t.color}}; position: relative"><span style="width: 36px; height: 26px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>{{t.label}}<sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span class="num" style="position: absolute; top: -4px; right: 14px; background: #DDF247; color: #0f3d2e; font-size: 10px; border-radius: 999px; padding: 0 5px">{{t.badge}}</span></sc-if></a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {

    const tab = (label, key, active, badge) => ({ label, icon: icons[key], color: active ? '#1f5c3a' : '#8c8c84', bg: active ? '#e8f1ea' : 'transparent', badge: badge || false });
    const done = { color: '#1f5c3a', bg: 'transparent', shadow: 'none', dotBg: '#1f5c3a', dotColor: '#fff', mark: '✓' };
    return {
      steps: [ { ...done, label: 'Plan' }, { ...done, label: 'Pantry' }, { label: 'Cart', mark: '5', color: '#1c1e17', bg: '#fff', shadow: '0 1px 3px rgba(20,22,15,.1)', dotBg: '#1f5c3a', dotColor: '#fff' }, { label: 'Track', mark: '6', color: '#8c8c84', bg: 'transparent', shadow: 'none', dotBg: '#eceae3', dotColor: '#8c8c84' } ],
      lines: [
        { name: 'Chivda Mix - Patal Poha', size: '150 g', cost: '750', packs: 5, img: '/_blob/2db82c323b3c3949794f5978b11fc4a2', noImg: false, plate: '#f4f1e9' },
        { name: 'Natural Peanut Butter Crunch', size: '1000 g', cost: '549', packs: 1, img: false, noImg: true, plate: '#eef3ee' },
        { name: 'Madras Mixture', size: '250 g', cost: '540', packs: 3, img: false, noImg: true, plate: '#eef3ee' },
        { name: 'Kabuli Chana', size: '1000 g', cost: '380', packs: 2, img: false, noImg: true, plate: '#eef3ee' }
      ],
      tabs: [tab('Home', 'home', false), tab('Shop', 'shop', false), tab('Plan', 'plan', true), tab('Cart', 'cart', false, '10'), tab('You', 'you', false)]
    };
  }
}
</script>
</body>
</html>
