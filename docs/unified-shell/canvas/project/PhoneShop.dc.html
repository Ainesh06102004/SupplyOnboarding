<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f5f1}
a{color:#1f5c3a}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6b6f63}
.num{font-family:'Space Grotesk',sans-serif;font-weight:600}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f6f5f1; font-family: 'Plus Jakarta Sans', sans-serif; color: #1c1e17">

<header style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid rgba(20,22,15,.07); background: rgba(246,245,241,.92)">
<span class="disp" style="font-size: 22px; color: #0f3d2e">KOI</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #e8743b; margin-top: 8px"></span>
<span style="flex: 1"></span>
<button type="button" aria-label="Search" style="width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid rgba(20,22,15,.1)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c1e17" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
<button type="button" style="height: 38px; padding: 0 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(20,22,15,.1); font: 600 12.5px 'Plus Jakarta Sans'">Delhi</button>
</header>
<div style="display: flex; gap: 8px; padding: 12px 16px; overflow: hidden; border-bottom: 1px solid rgba(20,22,15,.07)">
<span style="flex: none; font: 700 12.5px 'Plus Jakarta Sans'; background: #1f5c3a; color: #fff; border-radius: 999px; padding: 7px 13px">All</span>
<span style="flex: none; font: 600 12.5px 'Plus Jakarta Sans'; background: #e8f1ea; color: #1f5c3a; border: 1px solid #cfe3d6; border-radius: 999px; padding: 6px 12px">In your plan</span>
<span style="flex: none; font: 600 12.5px 'Plus Jakarta Sans'; background: #fff; border: 1px solid rgba(20,22,15,.12); border-radius: 999px; padding: 6px 12px">Snacks</span>
<span style="flex: none; font: 600 12.5px 'Plus Jakarta Sans'; background: #fff; border: 1px solid rgba(20,22,15,.12); border-radius: 999px; padding: 6px 12px">Nuts</span>
</div>

<div style="padding: 14px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<article style="background: #fff; border: 1px solid rgba(20,22,15,.07); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; height: 140px; border-radius: 13px; background: #f4f1e9; display: flex; align-items: center; justify-content: center"><img src="{{p.img}}" alt="{{p.name}}" style="width: 112px; height: 120px; object-fit: contain; mix-blend-mode: multiply"><span class="num" style="position: absolute; top: 7px; left: 7px; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2.5px solid {{p.ring}}; color: {{p.ring}}; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.score}}</span></div>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 0 4px"><span class="mono">{{p.brand}}</span><span style="font-size: 13.5px; font-weight: 700; line-height: 1.25; height: 34px; overflow: hidden">{{p.name}}</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px"><span class="num" style="font-size: 15px">₹{{p.price}}</span>
<sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; background: #1f5c3a; border-radius: 10px; height: 32px; color: #fff; font: 600 15px 'Plus Jakarta Sans'"><span style="width: 28px; text-align: center">−</span><span class="num" style="width: 16px; text-align: center">{{p.qty}}</span><span style="width: 28px; text-align: center">+</span></span></sc-if>
<sc-if value="{{p.notInCart}}" hint-placeholder-val="{{true}}"><button type="button" style="font: 700 12.5px 'Plus Jakarta Sans'; background: #fff; color: #1f5c3a; border: 1px solid #cfe3d6; border-radius: 10px; height: 32px; padding: 0 12px">Add</button></sc-if>
</div>
</article>
</sc-for>
</div>

<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 92px; background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(0,0,0,.2); padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 10px">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #f4f1e9; display: flex; align-items: center; justify-content: center; flex: none"><img src="/_blob/d1f18d7f1dda2b24e779164e38ed2c1e" alt="" style="width: 36px; height: 36px; object-fit: contain; mix-blend-mode: multiply"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: #1f5c3a">✓ Added · <span class="num">1</span> in cart</span><span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Daily Dry Fruit Mix</span></div>
<a href="PhoneCartSheet.dc.html" style="font: 700 13px 'Plus Jakarta Sans'; background: #1f5c3a; color: #fff; text-decoration: none; border-radius: 11px; padding: 10px 12px">View cart</a>
</div>
<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px; border-radius: 22px; background: rgba(255,255,255,.97); box-shadow: 0 10px 30px rgba(15,61,46,.12); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font: 600 10.5px 'Plus Jakarta Sans'; color: {{t.color}}; position: relative"><span style="width: 36px; height: 26px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{t.bg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>{{t.label}}<sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span class="num" style="position: absolute; top: -4px; right: 14px; background: #DDF247; color: #0f3d2e; font-size: 10px; border-radius: 999px; padding: 0 5px">{{t.badge}}</span></sc-if></a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const icons = { home: 'M4 11l8-7 8 7v9H4z', shop: 'M4 9h16l-1 11H5zM8 9V7a4 4 0 018 0v2', plan: 'M5 5h14v15H5zM5 10h14M9 3v4M15 3v4', cart: 'M5 7h14l-1.5 11h-11zM9 7a3 3 0 016 0', you: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c1-4 4-6 8-6s7 2 8 6' };
    const tab = (label, key, active, badge) => ({ label, icon: icons[key], color: active ? '#1f5c3a' : '#8c8c84', bg: active ? '#e8f1ea' : 'transparent', badge: badge || false });
    const ring = (s) => (s >= 80 ? '#1f5c3a' : s >= 50 ? '#b07d2b' : '#c2683a');
    const p = (name, brand, price, score, img, qty) => ({ name, brand, price, score, img, ring: ring(score), qty, inCart: qty > 0, notInCart: qty === 0 });
    return {
      products: [
        p('California Almonds', 'Open Secret', '450', 87, '/_blob/6b46d92120ccba28b5a1c8a9eb180b1a', 1),
        p('Premium Pampore Saffron', 'KisaanSay', '1,250', 69, '/_blob/7ddab595a7d1162f0191d88e9ea41c2e', 0),
        p('Daily Dry Fruit Mix', 'Open Secret', '350', 64, '/_blob/d1f18d7f1dda2b24e779164e38ed2c1e', 1),
        p('Chivda Mix - Patal Poha', 'Mama Nourish', '150', 64, '/_blob/2db82c323b3c3949794f5978b11fc4a2', 5)
      ],
      tabs: [tab('Home', 'home', false), tab('Shop', 'shop', true), tab('Plan', 'plan', false), tab('Cart', 'cart', false, '11'), tab('You', 'you', false)]
    };
  }
}
</script>
</body>
</html>
