<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook mode · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#083d2d}
a{color:#ddf247}a:hover{color:#f4fbd0}
.kc{font-variation-settings:"wdth" 84,"opsz" 96}
a:focus-visible,button:focus-visible{outline:2px solid #ddf247;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #083d2d; color: #f6f5f1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px">
    <a href="../Recipe.dc.html" aria-label="Leave cook mode" style="width: 44px; height: 44px; border-radius: 14px; background: rgba(246,245,241,0.1); display: grid; place-items: center; color: #f6f5f1"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="font: 600 11px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(246,245,241,0.75)">Step {{num}} of {{total}}</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: rgba(246,245,241,0.1); font: 500 10.5px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(246,245,241,0.75)"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #9fe7c4"></span>Screen on</span>
  </div>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 0 16px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="6"><span style="height: 4px; border-radius: 999px; background: {{b.bg}}"></span></sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <span style="font: 600 11px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.16em; color: #ddf247">Chicken, rice &amp; veg bowl · 4 boxes</span>
    <h1 class="kc" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: -0.03em; color: #f6f5f1">{{title}}</h1>
    <p style="margin: 0; font-size: 21px; line-height: 1.5; color: #f6f5f1">{{text}}</p>
    <sc-if value="{{hasUses}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font: 500 10.5px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(246,245,241,0.7)">For this step</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{uses}}" as="u" hint-placeholder-count="3"><span style="border-radius: 10px; padding: 6px 10px; background: rgba(221,242,71,0.14); color: #ddf247; font-size: 15px; font-weight: 600">{{u}}</span></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{hasTimer}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 22px; background: rgba(246,245,241,0.08); padding: 16px 18px">
        <span style="display: flex; flex-direction: column">
          <span style="font: 500 10.5px 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(246,245,241,0.7)">{{timerLabel}}</span>
          <span style="font: 600 44px 'Space Grotesk', sans-serif; line-height: 1; color: #f6f5f1">{{timer}}</span>
        </span>
        <button type="button" style="height: 52px; padding: 0 20px; border: 0; border-radius: 16px; background: #ddf247; color: #083d2d; font: 700 15px 'Plus Jakarta Sans', sans-serif; cursor: pointer">Start timer</button>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 16px 24px; border-top: 1px solid rgba(246,245,241,0.12)">
    <button type="button" onClick="{{back}}" aria-disabled="{{backOff}}" style="flex: none; height: 56px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(246,245,241,0.3); background: transparent; color: #f6f5f1; font: 600 15px 'Plus Jakarta Sans', sans-serif; cursor: pointer; opacity: {{backOpacity}}">Back</button>
    <button type="button" onClick="{{next}}" style="flex: 1; height: 56px; border: 0; border-radius: 16px; background: #ddf247; color: #083d2d; font: 700 16px 'Plus Jakarta Sans', sans-serif; cursor: pointer">{{nextLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const S = [
      { title: 'Marinate the chicken', text: 'Cut the chicken into bite-size pieces. Mix in the ginger-garlic paste, garam masala, salt and the lemon juice.', uses: ['4 large chicken breasts', '4 tsp ginger-garlic paste', '2 tsp garam masala', '1 tsp salt', '1 lemon'], timer: '20:00', timerLabel: 'Let it rest' },
      { title: 'Start the rice', text: 'Rinse the rice three times. Put it in a pot with 4 cups of water and bring it to a boil. Cover, turn the heat to low.', uses: ['2 cups basmati rice', '4 cups water'], timer: '12:00', timerLabel: 'On low, lid on' },
      { title: 'Chop the veg', text: 'While the rice cooks, chop the broccoli, capsicum and onion into small pieces, all about the same size.', uses: ['4 cups mixed veg'], timer: null },
      { title: 'Cook the chicken', text: 'Heat the oil in a wide pan on high. Add the chicken in one layer. Turn it once, and cook until no pink is left inside.', uses: ['2 tbsp oil'], timer: '06:00', timerLabel: 'On high' },
      { title: 'Cook the veg', text: 'Push the chicken to one side. Add the rest of the oil and the veg. Stir-fry so it stays a little crunchy, then mix everything with the rice.', uses: ['1 tbsp oil'], timer: '04:00', timerLabel: 'Stir-fry' },
      { title: 'Fill 4 boxes', text: 'Weigh the empty pot, then the full one: about 2.06 kg. Fill each box with about 515 g. Cool, lids on, into the fridge.', uses: ['4 boxes'], timer: null }
    ];
    const i = this.state.i;
    const s = S[i];
    const last = i === S.length - 1;
    return {
      num: i + 1, total: S.length,
      title: s.title, text: s.text, uses: s.uses, hasUses: s.uses.length > 0,
      hasTimer: Boolean(s.timer), timer: s.timer || '', timerLabel: s.timerLabel || '',
      bars: S.map((_, k) => ({ bg: k <= i ? '#ddf247' : 'rgba(246,245,241,0.18)' })),
      next: () => this.setState({ i: last ? 0 : i + 1 }),
      back: () => this.setState({ i: Math.max(0, i - 1) }),
      backOff: i === 0 ? 'true' : 'false',
      backOpacity: i === 0 ? '0.4' : '1',
      nextLabel: last ? 'Done: 4 lunches ready' : 'Next step'
    };
  }
}
</script>
</body>
</html>
